name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  validate:
    name: Validate KB (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip and install stdlib-only deps (none required)
        run: |
          python -m pip install --upgrade pip
          # 当前仓库仅依赖 Python 标准库，无需安装第三方包。

      - name: Run tests
        run: |
          python -S -m unittest discover -s tests -t .

      - name: Validate all modules
        run: |
          python -S tools/validate_module.py --all
